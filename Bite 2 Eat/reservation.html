<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reserve your table at Bite 2 Eat">
    <title>Bite 2 Eat | Reservation</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <script src="js/reservation.js" defer></script>
</head>

<body id="sommaire">

    <header>
        <h1>Bite 2 Eat</h1>

        <div class="outils">
            <button type="button" id="burger" class="burger" aria-label="Open the menu" aria-expanded="false" aria-controls="nav">&#9776; Menu</button>
            <button type="button" id="themeToggle" aria-pressed="false">Dark mode</button>
        </div>

        <nav id="nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="reservation.html" class="active" aria-current="page">Reservation</a>
        </nav>
        <img src="images/reserv.jpeg" alt="A table set for dinner at Bite 2 Eat" width="1400" height="788">
    </header>

    <main>
        <h2>Book Your Table</h2>
        <form id="reservationForm" novalidate>

            <label for="nom">Full Name:</label>
            <input type="text" id="nom" name="nom" required>
            <span class="erreur" id="erreur-nom" aria-live="polite"></span>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <span class="erreur" id="erreur-email" aria-live="polite"></span>

            <label for="telephone">Phone Number:</label>
            <input type="tel" id="telephone" name="telephone" required>
            <span class="erreur" id="erreur-telephone" aria-live="polite"></span>

            <label for="date">Reservation Date:</label>
            <input type="date" id="date" name="date" required>
            <span class="erreur" id="erreur-date" aria-live="polite"></span>

            <label for="heure">Reservation Time:</label>
            <input type="time" id="heure" name="heure" required>
            <span class="erreur" id="erreur-heure" aria-live="polite"></span>

            <label for="personnes">Number of People:</label>
            <select id="personnes" name="personnes" required>
                <option value="">Choose</option>
                <option value="1">1 Person</option>
                <option value="2">2 People</option>
                <option value="3">3 People</option>
                <option value="4">4 People</option>
                <option value="5">5 People</option>
                <option value="6">6 People</option>
            </select>
            <span class="erreur" id="erreur-personnes" aria-live="polite"></span>

            <label for="message">Additional Message (optional):</label>
            <textarea id="message" name="message" rows="4"></textarea>

            <button type="submit">Reserve Now</button>
        </form>

        <p id="confirmation" role="status"></p>
    </main>
    <span class="retour"><a href="#sommaire">^</a></span>
    <footer>
        <h2>Bite 2 Eat</h2>

        <div class="footer-container">

            <div>
                <h3>Contact</h3>
                <ul type="none">
                    <li>Address: Sfax, Tunisia</li>
                    <li><a href="mailto:contact@bite2eat.com">Email</a></li>
                    <li><a href="tel:+21612345678">Phone: +216 12 345 678</a></li>
                </ul>
            </div>

            <div>
                <h3>Opening Hours</h3>
                <ul type="none">
                    <li>Monday - Saturday: 11:00 - 23:00</li>
                    <li>Sunday: 12:00 - 22:00</li>
                </ul>
            </div>

            <div>
                <h3>Follow Us</h3>
                <ul type="none">
                    <li><a href="https://www.instagram.com/eat2bite/">Instagram</a></li>
                    <li><a href="https://www.facebook.com/eat2bite/">Facebook</a></li>
                </ul>
            </div>

        </div>

        <p>&copy; 2026 Bite 2 Eat. All rights reserved.</p>
    </footer>

</body>
</html>
